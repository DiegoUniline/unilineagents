name: Uniline quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Add the project's dependency installation and isolated test services here.
      - name: Execute real application scenarios
        run: node calidad/verificar-entrega.cjs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-delivery-${{ github.sha }}
          path: artifacts/calidad/
          if-no-files-found: error
          retention-days: 14
