name: Uniline package quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: node scripts/test-guardian.cjs
      - run: node scripts/test-autoprompter.cjs
      - run: node scripts/test-supabase-enterprise.cjs
      - run: node scripts/test-quality-gate.cjs
      - run: node scripts/test-delivery-gate.cjs
