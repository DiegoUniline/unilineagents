name: Verify and synchronize Uniline agents

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'core/**'
      - 'src/**'
      - 'skills/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'templates/**'
      - 'docs/**'
      - '.github/workflows/sync-generated.yml'

permissions:
  contents: write

jobs:
  verify-and-generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all distribution targets
        run: node scripts/build.cjs
      - name: Test guardrails
        run: node scripts/test-guardian.cjs
      - name: Test AutoPrompter integration
        run: node scripts/test-autoprompter.cjs
      - name: Synchronize generated assets on this PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/ commands/ dist/ skills/documentacion-modulo/SKILL.md
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize generated agent distributions"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
